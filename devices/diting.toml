[device]
codename = "diting"
brand = "Redmi"
model = "Redmi K50 Ultra"
ab = true
soc = { hans = "第一代骁龙®8+移动平台", hant = "Snapdragon® 8+ Gen 1 行動平台", en = "Snapdragon® 8+ Gen 1 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[recovery]
# After vendor is mounted, restarting stock adbd must still use its own
# libraries. AviumUI's libbase/libcrypto omit interfaces stock adbd needs.
# Installed hardware services declare their library paths separately.
ramdisk_libraries_only = true
# Keep Skyward and its child services' stderr in the recovery log.
capture_stdio = true

[display]
# ro.vendor.display.default_size in the stock recovery's prop.default.
width = 1220
height = 2712
density = 480
diagonal = 6.67

# The recovery's charger_fstab.qti already mounts modem at
# /vendor/firmware_mnt; init.recovery.hardware.rc binds its image folder
# over /vendor/firmware. No additional [firmware] mount is needed.
# Its ramdisk also already carries libsysutils.so and libcap.so for logd.

[modules]
# vendor_boot carries a generic goodix_core without the L12 binding.
# Prefer this build's vendor_dlkm modules, whose ST and Goodix drivers
# both handle xiaomi,l12-spi and detect which controller is fitted. Their
# dependencies include xiaomi_touch. The stock modules.load lists both.
sources = ["vendor_dlkm", "vendor_boot", "vendor"]
load = ["goodix_core", "fts_touch_spi", "qcom-hv-haptics"]
# First-stage init loads the generic Goodix module before Skyward. Replace
# that unbound copy with the L12 driver, unless it already owns a device.
reload = ["goodix_core"]
# The modem image mounted over /vendor/firmware hides these files. Read
# them from the vendor partition without its child mounts before probing.
firmware = [
    { name = "goodix_cfg_group_l12.bin", partition = "vendor", path = "firmware/goodix_cfg_group_l12.bin" },
    { name = "goodix_cfg_group_l12_new.bin", partition = "vendor", path = "firmware/goodix_cfg_group_l12_new.bin" },
    { name = "goodix_firmware_l12.bin", partition = "vendor", path = "firmware/goodix_firmware_l12.bin" },
    { name = "goodix_firmware_l12_new.bin", partition = "vendor", path = "firmware/goodix_firmware_l12_new.bin" },
    { name = "st_fts_l12.ftb", partition = "vendor", path = "firmware/st_fts_l12.ftb" },
]

# The L12 drivers report touches themselves. This vendor/odm has neither
# touch_report nor touchsensor, even though its shared init script names
# them. No host touch-processing service is started.

# Persist is listed in vendor_boot's fstab.qcom, but not the recovery's
# charger fstab. qseecomd's secure-storage listeners use it.
[partitions]
mounted = ["persist"]

# The installed vendor keeps these rules in /vendor/ueventd.rc rather
# than /vendor/etc/ueventd.rc. Apply them after loading the modules and
# before qseecomd/KeyMint start; root:root 0600 prevents their system
# account from opening QSEE or allocating its DMA buffers on Flyme 12.6.
[[owners]]
paths = ["/dev/qseecom", "/dev/smcinvoke"]
user = "system"
group = "drmrpc"
mode = 0o660

[[owners]]
paths = ["/dev/dma_heap/qcom,qseecom", "/dev/dma_heap/qcom,qseecom-ta"]
user = "system"
group = "system"
mode = 0o444

# qseecomd opens the UFS RPMB BSG node after dropping to system. The
# vendor rule gives it system:system 0600; leaving it root-owned lets
# listener registration succeed but rejects actual secure-storage I/O.
# Flyme's keystore database can keep its schema in persistent.sqlite-wal;
# pair this config with the WAL-aware reader in skyward-crypto/keystore2.rs.
[[owners]]
paths = ["/dev/0:0:0:49476"]
user = "system"
group = "system"
mode = 0o600

# This stock recovery carries no Binder service directory. Start the
# installed system's directory before KeyMint tries to register with it.
[[service]]
path = "/mnt/system/system/bin/servicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "servicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# Run the vendor CPU/power setup with the accounts from init.qti.kernel.rc.
# AviumUI's script exits 1 in recovery. This tuning is not a prerequisite
# for secure storage: keep the failure in kmsg and let qseecomd/KeyMint
# start. Use the recovery shell so the wrapper needs no additional files.
[[service]]
path = "/system/bin/sh"
args = ["-c", '''
/vendor/bin/sh /vendor/bin/init.kernel.post_boot.sh
status=$?
if [ "$status" -ne 0 ]; then
    echo "skyward: vendor post-boot setup exited $status; continuing hardware startup" > /dev/kmsg
fi
exit 0
''']
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

[[service]]
path = "/vendor/bin/qseecomd"
when = { property = "ro.vendor.build.version.sdk", value = "31" }
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# AviumUI's vendor libdmabufheap needs the newer C++ runtime shipped with
# that vendor. Pair it with the installed system's bootstrap runtime.
[[service]]
path = "/vendor/bin/qseecomd"
when = { property = "ro.vendor.build.version.sdk", value = "36" }
loader = "/system/bin/bootstrap/linker64"
libraries = ["/mnt/system/system/lib64/bootstrap", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
when = { property = "ro.vendor.build.version.sdk", value = "31" }
# libbinder_ndk is absent from the recovery. Use the installed system's
# Binder and its matching libc/loader for this NDK service.
libraries = ["/mnt/system/system/lib64/bootstrap", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
# This daemon also publishes the clock and shared-secret interfaces.
# Let startup perform their agreement before credentials are checked.
registers = [
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# Android 16's vendor libbinder defaults to /dev/vndbinder, but KeyMint is
# an AIDL service consumed through /dev/binder. Prefer the installed system
# libbinder (and its matching libbinder_ndk) before the vendor libraries.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
when = { property = "ro.vendor.build.version.sdk", value = "36" }
loader = "/system/bin/bootstrap/linker64"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The installed system's directory for the HIDL gatekeeper, boot control
# and WLAN supplicant. Its own init script runs it as system:readproc.
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
# The supplicant's HIDL manifest lists interface/instance separately, so
# publish it explicitly before the hardware directory starts.
description = "/vendor/etc/vintf/manifest/android.hardware.wifi.supplicant.xml"
user = "system"
groups = ["system", "readproc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
when = { property = "ro.vendor.build.version.sdk", value = "31" }
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# Android 16's Gatekeeper library needs the newer vendor C++ runtime.
# Keep its loader and system libraries aligned with the installed ROM.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
when = { property = "ro.vendor.build.version.sdk", value = "36" }
loader = "/system/bin/bootstrap/linker64"
libraries = ["/mnt/system/system/lib64/bootstrap", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
# The stock/Flyme vendor is Android 12, even with an Android 16 system.
when = { property = "ro.vendor.build.version.sdk", value = "31" }
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"
user = "root"
groups = ["root"]

# AviumUI 16.2.1 carries an Android 16 vendor with AIDL boot control.
# Select on the vendor SDK, rather than the system's Android version.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
when = { property = "ro.vendor.build.version.sdk", value = "36" }
loader = "/system/bin/bootstrap/linker64"
libraries = ["/mnt/system/system/lib64/bootstrap", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# QCA6490 is identified in prop.default and the vendor_boot device tree.
# init.target.rc writes fs_ready. The recovery covers /vendor/firmware
# with modem's image folder, so restore the driver's INI and MAC through
# the firmware loader. Keep the MAC at the stock link's persist location.
# The supplicant is HIDL 1.4 on this build, not the newer AIDL service.
[wlan]
modules = ["qca_cld3_qca6490"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/qca6490/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/qca6490/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/qca6490/wlan_mac.bin", partition = "persist", path = "qca6490/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
# Pair the installed libc with its loader; retain the vendor's BoringSSL
# ABI (sk_dup) rather than Android 17's incompatible crypto libraries.
loader = "/system/bin/bootstrap/linker64"
preload = ["/apex/com.android.vndk.v31/lib64/libcrypto.so", "/apex/com.android.vndk.v31/lib64/libssl.so"]
# The keystore engine also needs the installed system's libbinder_ndk.
libraries = ["/mnt/system/system/lib64/bootstrap", "/vendor/lib64", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
service = "android.hardware.wifi.supplicant@1.4::ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The version is recorded in the recovery ramdisk's prop.default.
# This is the SHA-256 of the entire supplied
# 100 MiB recovery.img, including its AVB footer, not the ZIP checksum.
[stock]
version = "OS3.0.3.0.VLFCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.3.0.VLFCNXM/diting-ota_full-OS3.0.3.0.VLFCNXM-user-15.0-04006cfe4c.zip"
recovery = "58289942fdc5958dd301f9e940c2bfb274558500ec0c1678d1e9a157fbd7705f"

# The L12 overlay in dtbo enables qcom,hv-haptics, with preloaded effect 0.
# The driver exports lra_frequency_hz. Strengths follow the existing
# Qualcomm profiles and still need to be checked on the phone.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }
