# Xiaomi MI 6X / wayne. Reference layout: devices/polaris.toml.
# Checked against wayne/{boot,recovery,vendor}.img, MIUI V12.0.2.0.PDCCNXM.
# See wayne-notes.md for evidence, build requirements and remaining blockers.
# The packer detects the supplied /sbin/recovery layout automatically.
# Use the matching current source for legacy FBE password unlock.
# LOS 18.1/API30 services below were read from the connected device.
# Original MIUI FDE remains a separate unsupported encryption layout.
# LOS 18.1 password unlock was verified with its own 4.4 boot kernel.
# Combine that kernel with the recovery ramdisk before packing; see notes.
# Stock Melon 4.19 still needs separate RPMB and kernel ICE compatibility.
# The experimental source patch is tools/wayne-419-legacy-ice.patch; it has
# not been compiled or verified for full unlock. See tools/wayne-melon419/.

# Recovery capacity verified with blockdev: 64 MiB (67,108,864 bytes).
# Pass --partition-size 67108864 to skyward-pack recovery; this is a build-time
# capacity check, not a TOML key or a requirement to pad the output image.
# The current local recovery.img has a newer /system/etc/init/hw/init.rc layout;
# the MIUI image observations below describe the original baseline only.

[device]
codename = "wayne"
brand = "Xiaomi"
model = "MI 6X"
ab = false
soc = { hans = "骁龙®660移动平台", hant = "Snapdragon® 660 行動平台", en = "Snapdragon® 660 Mobile Platform" }
os_version_prop = "ro.build.version.incremental"

[recovery]
# No logd in the supplied ramdisk. Keep process output in RAM:
# /skyward/run/recovery.log; export it before rebooting.
capture_stdio = true
# Stock executables are static; there is no system/etc/ld.config.txt.
# Polaris's ramdisk library flags do not apply to this recovery.
# Direct-mounted LOS FBE uses vendor Keymaster 3, not AIDL KeyMint.
# Requires the credential and file-backed keystore fixes in this tree.
legacy_fbe = true
# Match the installed LOS 18.1 boot header and security properties.
# The supplied recovery header is Android 13 / 2023-02; Keymaster returned
# configure -38 when launched with the installed Android 11 properties.
# Align the packed header and runtime properties. Full password unlock
# was verified with the installed LOS 18.1 kernel, not the Melon kernel.
legacy_version = { release = "11.0.0", security_patch = "2022-10-05" }

[display]
width = 1080
height = 2160
density = 440
diagonal = 5.99
# WAYNE's NT36672 Tianma/JDI panels specify a 4095 brightness range.
normal_max_brightness = 4095
# The current Melon fbdev panel displays frames already. Avoid the visible
# startup blank/unblank cycle; screen-off/wake still uses the existing path.
# Requires the matching runtime source; other devices keep their default.
fbdev_skip_initial_power_cycle = true
# CONFIG_FB_MSM_MDSS=y, CONFIG_DRM is unset. The existing fbdev backend
# is selected automatically; Polaris's KMS workarounds are not enabled.

[firmware]
# Kernel command line: firmware_class.path=/vendor/firmware_mnt/image.
partition = "modem"

[modules]
sources = ["vendor"]
# Ported MIUI vendors may omit modules.dep. exfat is not required for
# internal ext4 storage or Binder, so do not make it a boot dependency.
# To enable exFAT, verify modules.dep, exfat.ko and kernel compatibility
# on the installed vendor before adding "exfat" here.
load = []
# CONFIG_TOUCHSCREEN_NT36xxx=y and CONFIG_TOUCHSCREEN_NVT_D2S=y;
# no external touch module or unverified touch sysfs writes are needed.

# Verified LOS 18.1's 4.4 kernel exposes the legacy timed_output driver.
# The Melon 4.19 kernel instead needs click=0 (FF_PERIODIC), but failed
# to open these LOS keys even after its RPMB node alias was supplied.
[haptics]
timed_output = "/sys/class/timed_output/vibrator"
drive = 40
strength = { lightest = 0.5, strongest = 1.0 }

[backup]
partitions = ["boot", "recovery", "system", "vendor", "cust", "cache", "data"]

[wipe]
# No metadata partition is established by the supplied images.
# Keep firmware, calibration and regional cust data out of format targets.
formats = ["data", "cache", "system", "vendor"]

# From /etc/recovery.fstab in the supplied recovery. The packer writes
# these lines to /system/etc/skyward.fstab, which the runtime reads.
# Installed /system is mounted at /system_root to preserve the ramdisk.
[[fstab]]
device = "/dev/block/bootdevice/by-name/system"
mount_point = "/system"
filesystem = "ext4"
options = "ro,barrier=1"
extras = "wait,verify,formattable"

[[fstab]]
device = "/dev/block/bootdevice/by-name/vendor"
mount_point = "/vendor"
filesystem = "ext4"
options = "ro,barrier=1"
extras = "wait,verify,formattable"

[[fstab]]
device = "/dev/block/bootdevice/by-name/cache"
mount_point = "/cache"
filesystem = "ext4"
options = "noatime,nosuid,nodev,barrier=1,data=ordered"
extras = "wait,check,formattable"

# Stock recovery: encryptable=footer; stock vendor: forceencrypt=footer.
# MIUI uses FDE, which this FBE path cannot unlock. LOS 18.1 instead
# stores direct-mounted FBE with mode ice:aes-256-cts:v1. The runtime
# inspects actual policies/keys and never treats encrypted data as plain.
[[fstab]]
device = "/dev/block/bootdevice/by-name/userdata"
mount_point = "/data"
filesystem = "ext4"
options = "noatime,nosuid,nodev,barrier=1,data=ordered,noauto_da_alloc"
extras = "wait,check,encryptable=footer,formattable"

[[fstab]]
device = "/dev/block/bootdevice/by-name/cust"
mount_point = "/cust"
filesystem = "ext4"
options = "ro,nosuid,nodev,barrier=1"
extras = "wait,check"

[[fstab]]
device = "/dev/block/bootdevice/by-name/boot"
mount_point = "/boot"
filesystem = "emmc"
options = "defaults"
extras = "defaults"

[[fstab]]
device = "/dev/block/bootdevice/by-name/recovery"
mount_point = "/recovery"
filesystem = "emmc"
options = "defaults"
extras = "defaults"

[[fstab]]
device = "/dev/block/bootdevice/by-name/misc"
mount_point = "/misc"
filesystem = "emmc"
options = "defaults"
extras = "defaults"

# Additional real partitions and mount points from vendor/etc/fstab.qcom.
# Only modem is mounted automatically above; the other entries describe
# their filesystems without starting unrelated radio/sensor services.
[[fstab]]
device = "/dev/block/bootdevice/by-name/modem"
mount_point = "/vendor/firmware_mnt"
filesystem = "vfat"
options = "ro,shortname=lower,uid=0,gid=1000,dmask=227,fmask=337,context=u:object_r:firmware_file:s0"
extras = "wait"

[[fstab]]
device = "/dev/block/bootdevice/by-name/bluetooth"
mount_point = "/vendor/bt_firmware"
filesystem = "vfat"
options = "ro,shortname=lower,uid=1002,gid=3002,dmask=227,fmask=337,context=u:object_r:bt_firmware_file:s0"
extras = "wait"

[[fstab]]
device = "/dev/block/bootdevice/by-name/dsp"
mount_point = "/vendor/dsp"
filesystem = "ext4"
options = "ro,nosuid,nodev,barrier=1"
extras = "wait"

[[fstab]]
device = "/dev/block/bootdevice/by-name/persist"
mount_point = "/mnt/vendor/persist"
filesystem = "ext4"
options = "noatime,nosuid,nodev,barrier=1"
extras = "wait,check"

# Do not copy the stock mmcblk1p1 /sdcard placeholder: /sdcard is used for
# shared internal storage. This image alone does not prove a card exists.
# No [wlan] or [stock] until matching files/URL/hash are verified.

# LOS 18.1/API30: installed service paths, accounts and readiness read
# from its init scripts. Keep these gated to that inspected system layout.
# The matching runtime mounts flattened APEX read-only automatically.
[[service]]
when = { property = "ro.build.version.sdk", value = "30" }
path = "/system_root/system/bin/hwservicemanager"
loader = "/apex/com.android.runtime/bin/linker64"
libraries = ["/apex/com.android.runtime/lib64/bionic", "/system_root/system/lib64"]
user = "system"
groups = ["system", "readproc"]
ready_hardware_service = "android.hidl.manager@1.2::IServiceManager/default"

# The Melon 4.19 kernel exposes RPMB as /dev/mmcblk0rpmb (character
# device), while this LOS 18.1 vendor opens the old /dev/block path.
# Create the alias before qseecomd's first initialization. The matching
# 4.4 kernel already has the old block device and needs no alias.
[[service]]
when = { property = "ro.build.version.sdk", value = "30" }
path = "/system/bin/sh"
args = ["-c", "if [ -c /dev/mmcblk0rpmb ] && [ ! -e /dev/block/mmcblk0rpmb ]; then ln -s /dev/mmcblk0rpmb /dev/block/mmcblk0rpmb; fi"]
user = "root"
groups = ["root"]
oneshot = true

[[service]]
when = { property = "ro.build.version.sdk", value = "30" }
path = "/vendor/bin/qseecomd"
loader = "/apex/com.android.runtime/bin/linker64"
libraries = ["/vendor/lib64", "/apex/com.android.runtime/lib64/bionic", "/apex/com.android.vndk.current/lib64", "/system_root/system/lib64"]
user = "root"
groups = ["root"]
ready_property = "vendor.sys.listeners.registered"

[[service]]
when = { property = "ro.build.version.sdk", value = "30" }
path = "/vendor/bin/hw/android.hardware.keymaster@3.0-service-qti"
loader = "/apex/com.android.runtime/bin/linker64"
libraries = ["/vendor/lib64", "/apex/com.android.runtime/lib64/bionic", "/apex/com.android.vndk.current/lib64", "/system_root/system/lib64"]
user = "system"
groups = ["system", "drmrpc"]
ready_hardware_service = "android.hardware.keymaster@3.0::IKeymasterDevice/default"

[[service]]
when = { property = "ro.build.version.sdk", value = "30" }
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
loader = "/apex/com.android.runtime/bin/linker64"
libraries = ["/vendor/lib64", "/apex/com.android.runtime/lib64/bionic", "/apex/com.android.vndk.current/lib64", "/system_root/system/lib64"]
user = "system"
groups = ["system"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"

# These nodes were root:root 0600 in recovery. Installed ueventd hands
# them to the HAL accounts; keep that ownership in this recovery too.
[[owners]]
paths = ["/dev/qseecom"]
user = "system"
group = "drmrpc"
mode = 0o660

[[owners]]
paths = ["/dev/ion"]
user = "system"
group = "system"
mode = 0o664
